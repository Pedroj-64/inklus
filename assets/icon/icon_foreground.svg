<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Inklus: plumilla estilográfica escribiendo un trazo de tinta dorada. -->
  <defs>
    <linearGradient id="nibL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F6FF"/>
    </linearGradient>
    <linearGradient id="nibR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCE7FF"/>
      <stop offset="1" stop-color="#C3D5FF"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1F5C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Trazo de tinta: sale de la punta y hace un bucle de escritura. -->
  <path d="M318,706 C262,760 214,838 262,872 C312,906 402,806 470,812 C540,818 530,884 610,880 C668,877 712,840 752,800"
        fill="none" stroke="url(#ink)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Plumilla (dibujada vertical y girada 45°; la punta queda abajo a la izquierda). -->
  <g transform="translate(560 470) rotate(45)" filter="url(#shadow)">
    <!-- Mitad izquierda (luz) -->
    <path d="M0,-190 L-150,-190 L-150,-110 C-150,-20 -70,110 0,330 Z" fill="url(#nibL)"/>
    <!-- Mitad derecha (sombra) -->
    <path d="M0,-190 L150,-190 L150,-110 C150,-20 70,110 0,330 Z" fill="url(#nibR)"/>
    <!-- Virola / sección superior -->
    <rect x="-172" y="-300" width="344" height="120" rx="36" fill="#FFFFFF"/>
    <rect x="-172" y="-212" width="344" height="32" rx="12" fill="#C3D5FF"/>
    <!-- Respiradero + ranura -->
    <circle cx="0" cy="-30" r="34" fill="#2F6BF2"/>
    <path d="M0,-30 L0,320" stroke="#2F6BF2" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
