name: CI — Inklus

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  # Misma versión que exige pubspec.yaml (sdk ^3.13 → Flutter 3.47).
  FLUTTER_VERSION: '3.47.x'

jobs:
  # Falla si algún commit (o su historial) contiene claves, tokens o
  # credenciales. Los client IDs de OAuth y las SHA-1 son públicos y no cuentan.
  secret-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (con cobertura)
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build-apk:
    name: Build APK (debug)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

  build-linux:
    name: Build Linux
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de escritorio
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      # Flujos críticos de punta a punta (bienvenida → cuaderno → lápiz →
      # guardado) sobre la app de escritorio, con pantalla virtual.
      - name: Integration tests (Linux + Xvfb)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" flutter test integration_test -d linux

  release:
    name: Release firmado (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    # No depende de build-linux: su test de integración con Xvfb es sensible al
    # entorno de CI y no debe impedir publicar la release.
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de escritorio
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Secretos necesarios: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Preparar keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Faltan los secretos de firma (ANDROID_KEYSTORE_BASE64...)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          PROPS

      - name: Install dependencies
        run: flutter pub get

      # El tag debe coincidir con la versión de pubspec.yaml, y las notas de
      # la release son la sección de esa versión en CHANGELOG.md.
      - name: Notas de la versión (CHANGELOG)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con pubspec.yaml ($PUBSPEC)"
            exit 1
          fi
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md no tiene la sección [$VERSION]"
            exit 1
          fi
          cat >> release_notes.md <<'NOTES'

          ---
          ## Descargas

          | Plataforma | Archivo |
          |---|---|
          | Android (casi todas las tablets y teléfonos) | `app-arm64-v8a-release.apk` |
          | Android antiguos de 32 bits | `app-armeabi-v7a-release.apk` |
          | Android x86_64 / emuladores | `app-x86_64-release.apk` |
          | Linux (portable) | `Inklus-x86_64.AppImage` |
          | Linux (carpeta) | `inklus-linux-x64.tar.gz` |

          **Android:** abre el APK; Android pedirá permiso para instalar apps de origen desconocido. Se instala encima de la versión anterior sin perder las notas.
          **Linux:** `chmod +x Inklus-x86_64.AppImage && ./Inklus-x86_64.AppImage`.
          NOTES

      - name: Build APK + AAB (release)
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Build Linux (release) + AppImage + tar.gz
        run: |
          flutter build linux --release
          BUNDLE=build/linux/x64/release/bundle
          tar -C "$BUNDLE" -czf inklus-linux-x64.tar.gz .
          mkdir -p AppDir/usr/bin
          cp -r "$BUNDLE"/. AppDir/usr/bin/
          cp assets/icon/app_icon.png AppDir/inklus.png
          cat > AppDir/inklus.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Inklus
          Comment=Notas manuscritas con stylus
          Exec=inklus
          Icon=inklus
          Categories=Office;Utility;
          DESKTOP
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/inklus" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir Inklus-x86_64.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          name: Inklus ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/app-release.aab
            Inklus-x86_64.AppImage
            inklus-linux-x64.tar.gz
