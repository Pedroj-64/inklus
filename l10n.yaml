# Traducciones de Inklus (flutter gen-l10n). El español es la fuente:
# toda clave nueva va primero a app_es.arb y luego a app_en, app_pt (pt-BR),
# app_fr y app_de (test/l10n_test.dart comprueba que no falte ninguna).
arb-dir: lib/l10n
template-arb-file: app_es.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
# Flutter 3.50 marca flutter_localizations como obsoleto (pasa a material_ui),
# pero gen-l10n aún lo genera: se silencia solo en el código generado.
header: "// ignore_for_file: deprecated_member_use"
